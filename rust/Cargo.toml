[workspace]
resolver = "2"
members = ["."]

[package]
name = "ns-clob"
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/idrees2516/perp-options-clob"
description = "Unified nanosecond 0DTE options CLOB: matching, risk, margin, per-trade settlement, auctions, expiry, multi-shard platform (20M+ TPS class)"
keywords = ["exchange", "clob", "options", "0dte", "hft"]
categories = ["finance"]

[dependencies]
# Intentionally empty: zero runtime dependencies.

[dev-dependencies]
# Intentionally empty: custom in-tree latency/cycle/throughput harnesses.

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = false
strip = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "ns-tps"
path = "src/bin/tps.rs"

[[bench]]
name = "latency"
path = "benches/latency.rs"
harness = false

[[bin]]
name = "ns-venue"
path = "src/bin/venue.rs"

[[bin]]
name = "venue-tps"
path = "src/bin/venue_tps.rs"
