[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/orderbook",
    "crates/oracle",
    "crates/economics",
    "crates/margin",
    "crates/risk",
    "crates/engine",
    "crates/demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/idrees2516/perp-options-clob"
keywords = ["exchange", "clob", "orderbook", "perpetual-futures", "options"]
categories = ["finance"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 1
